services:
  # ─────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: order-tracker-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: order_tracker
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - order-tracker-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: order-tracker-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - order-tracker-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: order-tracker-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - order-tracker-net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # Microservices
  # ─────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: order-tracker-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3003
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/order_tracker?authSource=admin
    ports:
      - '3003:3003'
    networks:
      - order-tracker-net
    depends_on:
      mongodb:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: order-tracker-user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      USER_SERVICE_HOST: 0.0.0.0
      USER_SERVICE_PORT: 3004
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/order_tracker?authSource=admin
    ports:
      - '3004:3004'
    networks:
      - order-tracker-net
    depends_on:
      mongodb:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: order-tracker-product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRODUCT_SERVICE_HOST: 0.0.0.0
      PRODUCT_SERVICE_PORT: 3001
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/order_tracker?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3001:3001'
    networks:
      - order-tracker-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: order-tracker-order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: 3002
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/order_tracker?authSource=admin
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_PORT: 3001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '3002:3002'
    networks:
      - order-tracker-net
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: order-tracker-worker-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    networks:
      - order-tracker-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: order-tracker-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_PORT: 3001
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 3002
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3003
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 3004
    ports:
      - '3000:3000'
    networks:
      - order-tracker-net
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

networks:
  order-tracker-net:
    driver: bridge
